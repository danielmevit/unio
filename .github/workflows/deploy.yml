name: Deploy Unio site to Pages

# Builds the Astro site in site/ and publishes it to
# https://danielmevit.github.io/unio

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
      # The site reads the version from the newest CHANGELOG heading at build
      # time; without this the page keeps advertising the previous release.
      - "CHANGELOG.md"
  workflow_dispatch:

# Least privilege: the build job (which runs npm install) only reads the repo;
# only the deploy job may publish to Pages.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # npm install runs package scripts; keep the token out of .git/config.
          persist-credentials: false

      - name: Build the site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          package-manager: npm
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
